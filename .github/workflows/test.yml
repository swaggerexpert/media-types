# This workflow will do a clean install of node dependencies, build the source code and run tests across different versions of node
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions

name: Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci
      - name: Execute tests
        run: npm test
      - name: Build artifacts
        run: npm run build
      - name: Test artifacts
        run: npm run test:artifacts
      - name: Test typings
        run: npm run test:types
      - name: Pack tarball
        run: |
          mkdir -p pack
          npm pack --pack-destination ./pack
      - name: Upload tarball
        uses: actions/upload-artifact@v7
        with:
          name: tarball
          path: |
            pack/*.tgz
            test/artifacts/smoke.cjs

  compatibility:
    needs: test
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # oldest supported version (engines in package.json) and maintained versions
        node-version: [ 12.20.0, 14, 16, 18, 20, 22, 24 ]

    steps:
      - name: Download tarball
        uses: actions/download-artifact@v4
        with:
          name: tarball
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install tarball into a new project
        run: |
          mkdir consumer
          cd consumer
          npm init -y
          npm install ../pack/*.tgz
          # the package is resolved relative to the script, so the script must be inside the project
          cp ../test/artifacts/smoke.cjs .
      - name: Test installed package
        working-directory: consumer
        run: node smoke.cjs
